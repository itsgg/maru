    "macOS", "iOS", "WSL2", "PATH",
    "Anthropic", "OpenAI", "Codex", "Gemini", "MCP", "OAuth",
    "MARU_HOME", "MARU_PROFILE",
    "CLAUDE_CONFIG_DIR", "CODEX_HOME", "GEMINI_CLI_HOME",
]

