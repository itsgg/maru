name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  typos:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  deny:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        # MSRV pinned in Cargo.toml [workspace.package].rust-version
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  machete:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@main

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `--no-tests=pass` until Phase 1 adds the first real test (placeholder
       # crate ships with zero tests by design).
      - run: cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --doc --workspace --all-features

  # Shim cold-start gate per GENESIS §9 performance budget:
  # ≤15ms p50 from main() to execvp on Linux/macOS, ≤40ms on Windows.
  # The shim shipped in Phase 1 (PR #2). This job enforces the budget.
  bench-coldstart:
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine
      - run: cargo build --profile shim --bin maru-shim
      - name: Cold-start budget (15ms Linux)
        run: |
          # The shim dispatches by argv[0]; symlink under a harness name
          # so `main` exits early on the "no profile resolved" path
          # (an honest measurement of the shim's parse-and-dispatch cost
          # without exec'ing a real harness).
          ln -sf "$PWD/target/shim/maru-shim" "$PWD/target/shim/claude"
          # `--ignore-failure` because the shim exits 1 on no-active-profile;
          # hyperfine still measures wall time accurately. Budget enforces.
          hyperfine --warmup 3 --runs 50 --ignore-failure --export-json bench.json \
            "$PWD/target/shim/claude --version"
          mean_ms=$(jq '.results[0].mean * 1000' bench.json)
          echo "mean = ${mean_ms} ms"
          awk -v m="$mean_ms" 'BEGIN { exit (m > 15.0) }' \
            || { echo "::error::cold start ${mean_ms}ms exceeds 15ms budget"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json
