# Workspace manifest. Phase 1 crates land per the /autopilot task list.
# `maru-core` is a Phase 1 scaffold so cargo commands have a valid target.
[workspace]
resolver = "3"
members  = [
    "crates/maru-core",
    "crates/maru-store",
    "crates/maru-adapters",
    "crates/maru-activation",
    "crates/maru-shim",
    "crates/maru-cli",
]

[workspace.package]
version       = "0.1.0-alpha.6"
edition       = "2024"
rust-version  = "1.85"
license       = "Apache-2.0 OR MIT"
repository    = "https://github.com/itsgg/maru"
homepage      = "https://github.com/itsgg/maru"
authors       = ["maru contributors"]

# Workspace-wide lint config. Member crates inherit via `[lints] workspace = true`.
# Three layers: deny dangerous, warn safety-relevant, pedantic baseline.
[workspace.lints.rust]
unsafe_code               = "deny"   # crates/maru-shim env-application allowed via crate-local override
missing_docs              = "warn"
unreachable_pub           = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# Deny — these are bugs we never want shipped.
todo                = "deny"
dbg_macro           = "deny"
unimplemented       = "deny"
exit                = "deny"
print_stderr        = "deny"   # use tracing/eprintln! through the cli error printer
print_stdout        = "deny"   # use the cli output abstraction; preserves --json contract

# Warn — safety-relevant; allow with a justifying comment when truly needed.
unwrap_used                  = "warn"
expect_used                  = "warn"
indexing_slicing             = "warn"
arithmetic_side_effects      = "warn"
as_conversions               = "warn"
panic                        = "warn"
clone_on_ref_ptr             = "warn"
str_to_string                = "warn"
lossy_float_literal          = "warn"
mem_forget                   = "warn"
verbose_file_reads           = "warn"
rest_pat_in_fully_bound_structs = "warn"
let_underscore_must_use      = "warn"
empty_structs_with_brackets  = "warn"
undocumented_unsafe_blocks   = "warn"
multiple_unsafe_ops_per_block = "warn"

# Allow — pedantic lints that produce more noise than signal here.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"   # transitive dep duplicates outside our control

# Pinned versions for shared deps. See GENESIS §13 for the dependency budget.
# Member crates use these via `<dep> = { workspace = true }`.
[workspace.dependencies]
# Core deps (used across multiple crates)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
thiserror   = "2"
anyhow      = "1"

# CLI / logging
clap                 = { version = "4", features = ["derive", "env"] }
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }

# Filesystem / paths / locks
directories = "6"
fd-lock     = "4"
tempfile    = "3"
which       = "7"

# Archive (export/import)
tar    = "0.4"
flate2 = "1"

# Network / self-update — `maru update` only. Blocking HTTP via ureq; no async
# surface introduced. See GENESIS §13 dep-budget justification.
ureq         = { version = "3", default-features = false, features = ["rustls"] }
self-replace = "1"

# Dev / test
assert_cmd  = "2"
predicates  = "3"
insta       = { version = "1", features = ["yaml"] }
proptest    = "1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true

# `shim` profile: GENESIS §9. Applies to crates/maru-shim once that crate exists.
[profile.shim]
inherits      = "release"
panic         = "abort"
lto           = "fat"
codegen-units = 1
strip         = "symbols"
opt-level     = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
