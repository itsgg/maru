# `dist` config (formerly cargo-dist). Run: `dist init` to regenerate;
# `dist plan` to dry-run; `dist build` to produce artifacts.
# https://github.com/axodotdev/cargo-dist
#
# This file is the source of truth for what platforms we ship and how
# users install. release.yml is regenerated from here via `dist generate`.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "itsgg/homebrew-maru"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["LICENSE-APACHE", "LICENSE-MIT", "README.md", "CHANGELOG.md"]
# Generate and dist a source tarball
source-tarball = true
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Which binaries to ship from each crate.
[dist.binaries]
"maru-cli" = ["maru"]
"maru-shim" = ["maru-shim"]

# Build the shim under [profile.shim] (lto=fat, opt-level=z, strip)
# for the cold-start budget. The CLI uses [profile.dist] (release+thin-LTO).
[dist.dependencies.profile-overrides]
"maru-shim" = "shim"
