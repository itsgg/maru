name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  typos:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master

  deny:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        # MSRV pinned in Cargo.toml [workspace.package].rust-version
        uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  machete:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@main

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --workspace --all-features

  # Shim cold-start gate. Enabled once `crates/maru-shim` exists (Phase 1).
  # See GENESIS §9 performance budget: ≤15ms p50 from main() to execvp on
  # Linux/macOS, ≤40ms on Windows.
  bench-coldstart:
    if: false  # Phase 1: flip to `needs: [test]` once the shim ships.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine
      - run: cargo build --profile shim --bin maru-shim
      - name: Cold-start budget (15ms Linux/macOS)
        run: |
          hyperfine --warmup 3 --runs 50 --export-json bench.json \
            './target/shim/maru-shim --version'
          mean_ms=$(jq '.results[0].mean * 1000' bench.json)
          echo "mean = ${mean_ms} ms"
          awk -v m="$mean_ms" 'BEGIN { exit (m > 15.0) }' \
            || { echo "::error::cold start ${mean_ms}ms exceeds 15ms budget"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json
