# lefthook config. Install: `brew install lefthook && lefthook install`.
# https://lefthook.dev
#
# Philosophy: pre-commit hooks should be FAST (≤ a few seconds). Slow hooks
# get bypassed with `--no-verify`, then never run. Tokio, axum, ripgrep, and
# cargo itself ship zero local hooks for this reason — they trust CI as the
# real gate.
#
# Our split:
# - pre-commit: only what runs in single-digit seconds on the staged subset
#   (fmt --check, clippy on the whole workspace because Rust's per-file model
#   makes targeted linting expensive, typos, deny). Targeted via {staged_files}
#   where it makes sense.
# - pre-push: slower-but-still-bounded checks (test, machete).
# - commit-msg: cheap regex gate for Conventional Commits.
#
# We deliberately do NOT run `cargo nextest` pre-commit. CI is the source of
# truth for tests. If you want a one-shot local check before pushing, run
# `/check` in Claude Code or the gate snippet from CLAUDE.md.

min_version: 1.13.0

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.{rs,toml}"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    typos:
      run: typos {staged_files}
    deny:
      glob: "{Cargo.toml,Cargo.lock,deny.toml}"
      run: cargo deny --all-features check
    markdown:
      glob: "*.md"
      run: prettier --check {staged_files}

pre-push:
  parallel: true
  commands:
    test:
      run: cargo nextest run --workspace --all-features
    machete:
      run: cargo machete

commit-msg:
  commands:
    conventional:
      run: |
        head -n1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_/-]+\))?!?: .{1,100}$' \
          || { echo "Commit message must follow Conventional Commits."; \
               echo "Examples: 'feat: add codex adapter', 'fix(shim): handle empty argv'"; \
               exit 1; }
